<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mahjong Fortune Ways – Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:#fff3c4;
  background:radial-gradient(ellipse at 50% 0,#3b1250 0,#1b0a2e 45%,#3a0a14 100%);
  font-family:"Noto Serif SC","Songti SC",Georgia,serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#game{flex:1;min-height:0;position:relative}
#game canvas{display:block}
.tag{position:absolute;top:8px;z-index:2;font-size:12px;padding:3px 10px;border-radius:99px}
#demo{right:8px;background:#0e7a3a;border:1px solid #7ee2a0}
#fs{left:8px;display:none;background:#b3141c;border:1px solid #ffd54a;font-weight:700}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;background:#000c;padding:6px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#bar{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;align-items:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#2a0a10,#12040a);border-top:2px solid #c9972b}
.stats,.btns{display:flex;gap:8px;align-items:center}
.stat{min-width:92px;text-align:center;background:#0008;border:1px solid #7a5a1c;border-radius:10px;padding:4px 10px}
.stat small{display:block;font-size:11px;color:#d8b25a}
.stat b{font-size:18px}
button{font:inherit;font-weight:700;color:#fff3c4;min-width:46px;height:46px;padding:0 12px;cursor:pointer;
  background:linear-gradient(#1f6fb5,#0e3f73);border:2px solid #e0b24a;border-radius:12px}
button:active{transform:scale(.94)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #fff}
#spin{width:84px;height:84px;border-radius:50%;font-size:18px;background:radial-gradient(circle at 50% 30%,#35c577,#0b6b3a)}
#auto.on{background:linear-gradient(#e03a3a,#8a1212)}
@media(max-width:640px){.stat{min-width:78px}.stat b{font-size:16px}#spin{order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#app{padding-top:env(safe-area-inset-top,0px)}
</style></head>
<body>
<div id="app">
  <div id="game">
    <span class="tag" id="demo">DEMO · saldo virtual</span>
    <span class="tag" id="fs"></span>
    <div id="toast"></div>
  </div>
  <div id="bar">
    <div class="stats">
      <div class="stat"><small>Saldo</small><b id="bal">0</b></div>
      <div class="stat"><small>Taruhan</small><b id="bet">0</b></div>
      <div class="stat"><small>Menang</small><b id="win">0</b></div>
    </div>
    <div class="btns">
      <button id="minus" aria-label="Kurangi taruhan">−</button>
      <button id="plus" aria-label="Tambah taruhan">+</button>
      <button id="max">MAX</button>
      <button id="spin">SPIN</button>
      <button id="auto">AUTO</button>
      <button id="snd" aria-label="Suara">🔊</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
'use strict';
/* ============ KONFIGURASI ============ */
const W=760,H=660,COLS=5,ROWS=4,CELL=128;     // ROWS=4 → 1024 ways; ubah ROWS=3 untuk 243 ways
const GX=(W-COLS*CELL)/2,GY=116;
const BETS=[10,20,50,100,200,500,1000],START_BAL=100000;
const MULT=[[1,2,3,5],[2,4,6,10]];            // multiplier cascade: [normal, free spins]
const WILD=7,SCAT=8,BIG=[10,25,50];           // ambang Big/Mega/Super Mega (x taruhan)
const WEIGHT=[22,22,22,9,8,7,6,3,3];          // bobot kemunculan simbol (wild tidak di reel 1 & 5)
const PAY=[[.05,.15,.4],[.05,.15,.4],[.06,.18,.5],[.1,.3,.8],[.15,.4,1],[.25,.6,1.5],[.4,1,3]]; // x taruhan per way, untuk 3/4/5 simbol
const SYM=[
 {ch:'萬',c:['#d32f2f','#7a0f0f']},{ch:'筒',c:['#1e88e5','#0d3c75']},{ch:'條',c:['#2e9e57','#0b5a2b']},   // rendah: Wan, Tong, Tiao
 {ch:'虎',c:['#ff9f1c','#a34a00']},{ch:'龜',c:['#26a69a','#0b5f58']},{ch:'鳳',c:['#ec407a','#8e1048']},{ch:'龍',c:['#e53935','#6b0d0d']}, // tinggi: Harimau, Kura-kura, Phoenix, Naga
 {ch:'福',c:['#ffd54a','#b8860b']},{ch:'發',c:['#7b2ff7','#3a0f8f']}                                       // Wild, Scatter
];
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('id-ID');
const px=c=>GX+c*CELL+CELL/2,py=r=>GY+r*CELL+CELL/2;

/* ============ AUDIO (WebAudio, tanpa file) ============ */
const AU={on:true,ctx:null,t:null,
 tone(f,d=.12,type='sine',v=.12,at=0){if(!this.on)return;
  const C=this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();if(C.state==='suspended')C.resume();
  const o=C.createOscillator(),g=C.createGain(),t=C.currentTime+at;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(C.destination);o.start(t);o.stop(t+d);},
 spin(){this.tone(200,.1,'square',.05);},land(){this.tone(110,.07,'triangle',.12);},
 win(n){[523,659,784,988,1175].slice(0,Math.min(n+2,5)).forEach((f,i)=>this.tone(f,.2,'triangle',.1,i*.06));},
 big(){[392,523,659,784,1047].forEach((f,i)=>this.tone(f,.35,'sawtooth',.06,i*.1));},
 start(){if(this.t)return;const s=[262,294,330,392,440];this.t=setInterval(()=>{if(Math.random()<.65)this.tone(s[Math.random()*5|0],.6,'sine',.025);},450);}
};

/* ============ TEKSTUR (digambar dengan canvas, tanpa gambar eksternal) ============ */
function makeTextures(sc){
 SYM.forEach((s,i)=>{
  const t=sc.textures.createCanvas('s'+i,CELL,CELL),x=t.getContext(),hi=i>=3,m=6,g=x.createLinearGradient(0,0,0,CELL);
  if(hi){g.addColorStop(0,s.c[0]);g.addColorStop(1,s.c[1]);}else{g.addColorStop(0,'#fffdf0');g.addColorStop(1,'#e6d6a2');}
  x.beginPath();x.roundRect(m,m,CELL-2*m,CELL-2*m,20);x.fillStyle=g;x.fill();
  x.lineWidth=5;x.strokeStyle=hi?'#ffd54a':s.c[1];x.stroke();
  x.textAlign='center';x.textBaseline='middle';x.font='900 '+CELL*.6+'px "Noto Serif SC","Songti SC","Microsoft YaHei",serif';
  x.shadowColor='#0008';x.shadowBlur=6;x.fillStyle=!hi?s.c[0]:i===WILD?'#c62828':'#fff2b0';x.fillText(s.ch,CELL/2,CELL/2+5);
  t.refresh();
 });
 const t=sc.textures.createCanvas('p',24,24),x=t.getContext(),g=x.createRadialGradient(12,12,2,12,12,11);
 g.addColorStop(0,'#fff6b0');g.addColorStop(1,'#d89a1c');x.fillStyle=g;x.beginPath();x.arc(12,12,11,0,7);x.fill();t.refresh();
}

/* ============ SCENE UTAMA ============ */
class Main extends Phaser.Scene{
 constructor(){super('main');}
 create(){
  makeTextures(this);
  Object.assign(this,{bal:START_BAL,bi:3,bet:BETS[3],win:0,fs:0,fsTotal:0,auto:false,busy:false});
  this.bg();this.hud();
  this.reels=this.add.container(0,0);
  const mg=this.make.graphics();mg.fillRect(GX,GY,COLS*CELL,ROWS*CELL);this.reels.setMask(mg.createGeometryMask());
  this.em=this.add.particles(0,0,'p',{speed:{min:120,max:420},lifespan:700,scale:{start:.7,end:0},gravityY:500,blendMode:'ADD',emitting:false}).setDepth(20);
  this.bind();this.setMult(-1,false);this.ui();
  this.busy=true;this.dropIn().then(()=>{this.busy=false;this.ui();});
 }
 /* ---- latar: bulan, gunung, pagoda, awan, lantern ---- */
 bg(){
  const g=this.add.graphics(),cx=W/2;
  g.fillStyle(0xffe8a3,.85).fillCircle(110,70,40);
  g.fillStyle(0x2c0d3a,1).fillTriangle(-60,H,170,260,400,H).fillTriangle(330,H,600,230,880,H);
  g.fillStyle(0x6b1220,.75).lineStyle(3,0xe0b24a,.55);
  for(let i=0;i<6;i++){const y=20+i*104,w=110+i*30,p=[{x:cx-w,y:y+26},{x:cx-w*.6,y},{x:cx+w*.6,y},{x:cx+w,y:y+26}];
   g.fillPoints(p,true);g.strokePoints(p,true);g.fillRect(cx-w*.55,y+26,w*1.1,60);}
  for(let i=0;i<5;i++){
   const c=this.add.container(80+i*160,150+(i%3)*150,[this.add.ellipse(0,0,150,30,0xffffff,.13),this.add.ellipse(30,-14,90,28,0xffffff,.13)]);
   this.tweens.add({targets:c,x:'+=120',duration:8000+i*1500,yoyo:true,repeat:-1,ease:'Sine.inOut'});}
  [[26,1],[W-26,1],[78,.7],[W-78,.7]].forEach(([x,s])=>this.lantern(x,0,s));
 }
 lantern(x,y,s){
  const c=this.add.container(x,y,[this.add.rectangle(0,20,2,40,0xe0b24a),this.add.ellipse(0,64,56,66,0xff9f1c,.3),
   this.add.ellipse(0,64,40,50,0xd62828).setStrokeStyle(3,0xffd54a),this.add.rectangle(0,92,3,22,0xffd54a)]).setScale(s);
  this.tweens.add({targets:c,angle:{from:-6,to:6},duration:2200+s*500,yoyo:true,repeat:-1,ease:'Sine.inOut'});
 }
 hud(){
  this.add.text(W/2,34,'MAHJONG FORTUNE WAYS',{fontFamily:'"Noto Serif SC",Georgia,serif',fontSize:'34px',fontStyle:'bold',color:'#ffd54a',stroke:'#6b0f14',strokeThickness:7}).setOrigin(.5);
  this.mt=[0,1,2,3].map(i=>this.add.text(W/2+(i-1.5)*92,84,'',{fontSize:'22px',fontStyle:'bold',padding:{x:14,y:4}}).setOrigin(.5));
  this.add.rectangle(W/2,GY+ROWS*CELL/2,COLS*CELL+16,ROWS*CELL+16,0x240812,.82).setStrokeStyle(4,0xe0b24a);
  for(let c=1;c<COLS;c++)this.add.rectangle(GX+c*CELL,GY+ROWS*CELL/2,2,ROWS*CELL,0xe0b24a,.25);
 }
 setMult(step,free){
  const m=MULT[free?1:0];
  this.mt.forEach((t,i)=>{const on=i===Math.min(step,3);t.setText('x'+m[i]).setColor(on?'#2b0a12':'#ffd54a').setBackgroundColor(on?'#ffd54a':'#5b1020');});
 }
 /* ---- UI & kontrol ---- */
 bind(){
  const on=(id,f)=>$(id).onclick=()=>{if(!this.busy||id==='auto'||id==='snd')f();};
  on('spin',()=>this.play());
  on('minus',()=>this.setBet(this.bi-1));on('plus',()=>this.setBet(this.bi+1));on('max',()=>this.setBet(BETS.length-1));
  on('auto',()=>{this.auto=!this.auto;$('auto').classList.toggle('on',this.auto);if(this.auto&&!this.busy)this.play();});
  on('snd',()=>{AU.on=!AU.on;$('snd').textContent=AU.on?'🔊':'🔇';});
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!this.busy&&!e.repeat)this.play();}});
 }
 setBet(i){this.bi=Phaser.Math.Clamp(i,0,BETS.length-1);this.bet=BETS[this.bi];AU.tone(660,.05);this.ui();}
 ui(){
  $('bal').textContent=fmt(this.bal);$('bet').textContent=fmt(this.bet);$('win').textContent=fmt(this.win);
  const f=$('fs');f.style.display=this.fs>0?'block':'none';f.textContent='FREE SPINS: '+this.fs;
  ['minus','plus','max'].forEach(id=>$(id).disabled=this.busy||this.fs>0);$('spin').disabled=this.busy;
 }
 toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(this._t);this._t=setTimeout(()=>t.classList.remove('show'),2200);}
 tw(c){return new Promise(r=>this.tweens.add({...c,onComplete:()=>{c.done&&c.done();r();}}));}
 wait(ms){return new Promise(r=>this.time.delayedCall(ms,r));}
 rand(c){
  const w=WEIGHT.map((x,i)=>i===WILD&&(c===0||c===COLS-1)?0:x);let n=Math.random()*w.reduce((a,b)=>a+b);
  for(let i=0;i<w.length;i++)if((n-=w[i])<0)return i;return 0;
 }
 mk(c,id,y){const s=this.add.image(px(c),y,'s'+id);this.reels.add(s);return s;}
 /* ---- alur permainan ---- */
 async play(){
  this.busy=true;this.ui();AU.start();
  do{
   if(this.fs===0&&this.bal<this.bet){this.bal=START_BAL;this.toast('Saldo demo diisi ulang');}
   await this.spin();await this.wait(250);
  }while(this.fs>0||this.auto);
  this.busy=false;this.ui();
 }
 async spin(){
  const free=this.fs>0;
  if(free)this.fs--;else{this.bal-=this.bet;this.fsTotal=0;}
  this.win=0;this.setMult(-1,free);this.ui();AU.spin();
  await this.dropOut();await this.dropIn();
  let step=0,total=0;
  for(;;){                                     // loop cascade sampai tidak ada kemenangan
   const r=this.evaluate();if(!r.amount)break;
   const m=MULT[free?1:0][Math.min(step,3)],w=r.amount*this.bet*m;
   total+=w;this.win=total;this.setMult(step,free);AU.win(step);
   await this.explode(r.cells,w,m);this.ui();await this.cascade();step++;
  }
  this.setMult(-1,free||this.fs>0);this.bal+=total;if(free)this.fsTotal+=total;this.ui();
  const x=total/this.bet;
  if(x>=BIG[0])await this.banner(x>=BIG[2]?'SUPER MEGA WIN':x>=BIG[1]?'MEGA WIN':'BIG WIN','',total);
  const sc=this.grid.flat().filter(v=>v===SCAT).length;
  if(sc>=3){const add=8+(sc-3)*2;this.fs+=add;this.ui();await this.banner('FREE SPINS','+'+add+' putaran',null);}
  if(free&&this.fs===0&&this.fsTotal>0)await this.banner('TOTAL FREE SPINS','',this.fsTotal);
 }
 evaluate(){                                    // ways: kiri→kanan, wild menggantikan semua kecuali scatter
  let amount=0;const cells=new Set();
  for(let s=0;s<7;s++){
   let ways=1,len=0;const hit=[];
   for(let c=0;c<COLS;c++){
    const rows=[];for(let r=0;r<ROWS;r++)if(this.grid[c][r]===s||this.grid[c][r]===WILD)rows.push(r);
    if(!rows.length)break;ways*=rows.length;len++;hit.push(rows);
   }
   if(len>=3){amount+=PAY[s][len-3]*ways;hit.forEach((rows,c)=>rows.forEach(r=>cells.add(c*ROWS+r)));}
  }
  return {amount,cells};
 }
 async dropOut(){
  const ps=[];
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const s=this.spr[c][r];
   ps.push(this.tw({targets:s,y:s.y+H,duration:380,delay:c*40+(ROWS-r)*20,ease:'Cubic.easeIn',done:()=>s.destroy()}));}
  await Promise.all(ps);
 }
 async dropIn(){
  const ps=[];this.grid=[];this.spr=[];
  for(let c=0;c<COLS;c++){this.grid[c]=[];this.spr[c]=[];
   for(let r=0;r<ROWS;r++){
    const id=this.rand(c),s=this.mk(c,id,GY-CELL*(ROWS-r)-CELL/2);this.grid[c][r]=id;this.spr[c][r]=s;
    ps.push(this.tw({targets:s,y:py(r),duration:420,delay:c*110+r*40,ease:'Cubic.easeOut',done:()=>{if(r===ROWS-1)AU.land();}}));}}
  await Promise.all(ps);
 }
 async explode(cells,w,m){
  const sp=[];cells.forEach(k=>{const c=(k/ROWS)|0,r=k%ROWS;sp.push(this.spr[c][r]);this.spr[c][r]=null;});
  await this.tw({targets:sp,scale:1.15,duration:170,yoyo:true});
  sp.forEach(s=>this.em.explode(8,s.x,s.y));
  const t=this.add.text(W/2,GY+ROWS*CELL/2,'+'+fmt(w)+(m>1?'  x'+m:''),{fontSize:'46px',fontStyle:'bold',color:'#fff3c4',stroke:'#7a1010',strokeThickness:8}).setOrigin(.5).setDepth(30);
  this.tweens.add({targets:t,y:t.y-60,alpha:0,duration:900,delay:200,onComplete:()=>t.destroy()});
  await this.tw({targets:sp,scale:0,alpha:0,duration:300,ease:'Back.easeIn',done:()=>sp.forEach(s=>s.destroy())});
 }
 async cascade(){                               // simbol di atas jatuh, slot kosong diisi simbol baru dari atas
  const ps=[];
  for(let c=0;c<COLS;c++){
   const keep=[];for(let r=ROWS-1;r>=0;r--)if(this.spr[c][r])keep.push([this.grid[c][r],this.spr[c][r]]);
   const G=[],S=[];let n=0;
   for(let i=0,r=ROWS-1;r>=0;r--,i++){
    let id,s;
    if(i<keep.length){id=keep[i][0];s=keep[i][1];}else{id=this.rand(c);s=this.mk(c,id,GY-CELL/2-CELL*(n++));}
    G[r]=id;S[r]=s;
    if(Math.abs(s.y-py(r))>1)ps.push(this.tw({targets:s,y:py(r),duration:420,delay:c*30,ease:'Bounce.easeOut'}));
   }
   this.grid[c]=G;this.spr[c]=S;
  }
  await Promise.all(ps);AU.land();
 }
 async banner(title,sub,count){                 // Big / Mega / Super Mega Win, Free Spins
  const ov=this.add.container(0,0).setDepth(50);
  const tt=this.add.text(W/2,H/2-50,title,{fontSize:'62px',fontStyle:'bold',color:'#ffd54a',stroke:'#7a1010',strokeThickness:12}).setOrigin(.5).setScale(0);
  const nt=this.add.text(W/2,H/2+50,sub,{fontSize:'48px',fontStyle:'bold',color:'#fff',stroke:'#000',strokeThickness:6}).setOrigin(.5);
  ov.add([this.add.rectangle(W/2,H/2,W,H,0,.72),tt,nt]);
  const rain=this.add.particles(0,-20,'p',{x:{min:0,max:W},speedY:{min:260,max:520},lifespan:2600,frequency:count!=null?35:90,scale:{start:.9,end:.6},rotate:{start:0,end:360}}).setDepth(51);
  AU.big();this.tweens.add({targets:tt,scale:1,duration:500,ease:'Back.easeOut'});
  if(count!=null)this.tweens.addCounter({from:0,to:count,duration:2000,onUpdate:t=>nt.setText(fmt(t.getValue()))});
  await this.wait(2800);rain.destroy();ov.destroy();
 }
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,transparent:true,
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Main});

</script>
</body></html>
